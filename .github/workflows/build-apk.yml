name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Supabase Build Configuration
        run: |
          echo "=== Checking Supabase Configuration in Build Environment ==="
          if [ -n "$SUPABASE_URL" ]; then
            echo "✅ SUPABASE_URL is configured (length: ${#SUPABASE_URL})"
          else
            echo "::warning title=Missing SUPABASE_URL::SUPABASE_URL is not set in GitHub Secrets/Variables. The APK will display a configuration reminder."
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "✅ SUPABASE_ANON_KEY is configured (length: ${#SUPABASE_ANON_KEY})"
          else
            echo "::warning title=Missing SUPABASE_ANON_KEY::SUPABASE_ANON_KEY is not set in GitHub Secrets/Variables."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}

      - name: Run Unit Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Found debug APK: app/build/outputs/apk/debug/app-debug.apk"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: app/build/outputs/apk/debug/app-debug.apk not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-Lead-Saver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
