name: WA Lead Saver native regression tests (branch only)

# Runs on the isolated development branch and PRs targeting it. No APK, release, or merge.
on:
  push:
    branches:
      - feature/flutter-ui-and-history-performance-20261122
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/native-branch-check.yml'
  pull_request:
    branches:
      - feature/flutter-ui-and-history-performance-20261122
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/native-branch-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Run native Room and Kotlin unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Retry once only when Maven Central throttles dependency downloads.
          # A compilation error or failed assertion MUST remain a failure.
          if ./gradlew --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee native-test.log; then
            exit 0
          fi
          if grep -Eq 'Received status code 429|Too Many Requests' native-test.log; then
            echo "Maven returned 429; performing one bounded retry."
            sleep 15
            ./gradlew --no-daemon testDebugUnitTest --stacktrace
          else
            echo "Native tests failed for a non-throttling reason."
            exit 1
          fi
